<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="t d">
  <title id="t">Ilustrasi pengecekan risiko diabetes</title>
  <desc id="d">Alat cek gula darah dengan tetes darah, denyut jantung, dan pohon keputusan mini.</desc>
